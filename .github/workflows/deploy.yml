name: Deploy Hugo site to gh-pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# The deploy step pushes the built site to the gh-pages branch, so it needs
# write access to repository contents.
permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with theme submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # full history so Hugo can derive lastmod from git

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Relearn 9.1.x requires Hugo >= 0.165.0 (see themes/hugo-theme-relearn/theme.toml)
          hugo-version: '0.166.0'
          extended: true

      - name: Build
        # baseURL is derived from the repository name, so it stays correct if the
        # repo is renamed; hugo.toml's baseURL only matters for local builds.
        run: hugo --gc --minify --baseURL "$BASE_URL"
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # PDF scriptum: Hugo cannot write PDFs, so headless Chromium prints the
      # theme's whole-book print view into public/ (see scripts/pdf/build-pdf.mjs).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/pdf/package-lock.json

      - name: Build PDF
        working-directory: scripts/pdf
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node build-pdf.mjs --base-url "$BASE_URL"
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true # keep gh-pages as a single commit; no build history
