<text x='20' y='798' font-size='12' font-family='Helvetica, Arial, sans-serif' fill='#333'>Beinchen-Nummern: USB oben, 1 oben links bis 20 unten links, 21 unten rechts bis 40 oben rechts.</text>
<text x='20' y='822' font-size='12' font-family='Helvetica, Arial, sans-serif' fill='#333'>LED: das lange Bein (+) zeigt zum Widerstand, das kurze Bein (−) zu GND.  Taster: zwei diagonal gegenüberliegende Beinchen.</text>
<text x='20' y='846' font-size='12' font-family='Helvetica, Arial, sans-serif' fill='#333'>Kabelfarben im Bild: schwarz = GND, rot = 3,3 V, lila = 5 V, blau = Signal. Eure Kabel dürfen andere Farben haben.</text>
<text x='20' y='870' font-size='12' font-family='Helvetica, Arial, sans-serif' fill='#333'>Servo: Startet der Pico neu, sobald sich der Servo bewegt, reicht der USB-Strom nicht. Dann Lehrkraft fragen.</text>
